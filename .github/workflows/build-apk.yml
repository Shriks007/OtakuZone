name: Build OtakuZone Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "ANILIST_CLIENT_ID=57081" >> local.properties
          echo "ANILIST_CLIENT_SECRET=${{ secrets.ANILIST_CLIENT_SECRET || '394ps9UhZgGlIrtex7e8tfWBNNBgWJ0sPv5rmoy1' }}" >> local.properties
          echo "ANILIST_REDIRECT_URI=https://anilist.co/api/v2/oauth/pin" >> local.properties
          echo "MANGAVAULT_DEFAULT_URL=http://localhost:8000" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (arm64 / universal)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtakuZone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-debug
          name: OtakuZone v1.0.0 Debug APK
          body: |
            Automated debug APK build for **OtakuZone** (arm64 / Nothing Phone 4a).
            - Stream servers via AniKage worker + Zoko (MAL route)
            - AniList OAuth PIN login & watch progress sync
            - WorkManager local notification tray alerts
            - MangaVault reader (vertical + horizontal)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
